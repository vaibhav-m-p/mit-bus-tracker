<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driver Panel - MIT Mysore Bus</title>
<style>
body{margin:0;font:16px system-ui,Segoe UI,sans-serif;background:#f4f5f7;color:#1c1f26}
header{background:#1e3a8a;color:#fff;padding:12px 16px;font-weight:700}
.box{max-width:420px;margin:16px auto;padding:18px;background:#fff;border-radius:14px;box-shadow:0 1px 6px #0002}
select,input[type=password],button{width:100%;padding:13px;margin:6px 0;font-size:16px;border-radius:10px;border:2px solid #c7cdd8}
button{border:0;background:#1e3a8a;color:#fff;font-weight:700;cursor:pointer}
button.go{background:#16a34a;font-size:20px;padding:18px}button.stop{background:#dc2626;font-size:20px;padding:18px}
button.link{background:none;color:#1e3a8a;font-weight:400}
.muted{color:#667085;font-size:14px}#err{color:#dc2626;min-height:20px}label{display:block;margin:8px 0}
</style></head><body>
<header>🚌 Driver Panel · MIT Mysore</header>
<div class="box" id="login">
  <select id="route"></select>
  <input id="pin" type="password" inputmode="numeric" placeholder="4-digit PIN">
  <button id="go">Login</button><div id="err"></div>
</div>
<div class="box" id="trip" hidden>
  <h2 id="title" style="margin:0 0 4px"></h2><div class="muted" id="sub"></div>
  <label><input type="radio" name="m" value="sim" checked> Simulated GPS (demo)</label>
  <label><input type="radio" name="m" value="gps"> Phone GPS (needs HTTPS or localhost)</label>
  <button id="tbtn" class="go">▶ Start Trip</button>
  <div id="st" class="muted"></div>
  <button class="link" id="out">Logout</button>
</div>
<script>
const CAMPUS=[12.4413,76.7140];   // keep same as index.html
const $=s=>document.querySelector(s);
let token=sessionStorage.getItem('tok'),route=null,routes=[],timer=null,active=false,sim=null;
const label=r=>r.group==='B'?'Route B'+r.no:'Route '+r.no+(r.id.endsWith('b')?'b':'');
const mode=()=>document.querySelector('[name=m]:checked').value;
async function api(p,b){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,...b})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}
function rnd(n){const x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}

/* Simulator: bus starts a few km from campus and drives straight to it (fast-forwarded demo) */
function startSim(){const i=routes.findIndex(r=>r.id===route.id)+1,a=rnd(i)*6.283,d=.03+rnd(i+50)*.12;
  sim={la:CAMPUS[0]+Math.sin(a)*d,lo:CAMPUS[1]+Math.cos(a)*d,p:0}}
function simPos(){sim.p=Math.min(1,sim.p+.02);
  return{lat:sim.la+(CAMPUS[0]-sim.la)*sim.p,lng:sim.lo+(CAMPUS[1]-sim.lo)*sim.p,speed:30+Math.round(rnd(sim.p*77)*15)}}
const gpsPos=()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(
  p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,speed:(p.coords.speed||0)*3.6}),e=>no(new Error(e.message)),{enableHighAccuracy:true,timeout:8000}):no(new Error('GPS not available')));

async function step(){try{const p=mode()==='sim'?simPos():await gpsPos();await api('location',p);
  $('#st').textContent='● Sharing location · '+new Date().toLocaleTimeString();
  if(mode()==='sim'&&sim.p>=1)await end('Reached campus. Trip ended.')}catch(e){$('#st').textContent='⚠ '+e.message}}
async function begin(fresh){if(fresh)await api('trip/start',{});active=true;if(mode()==='sim')startSim();ui();step();timer=setInterval(step,2000)}
async function end(msg){clearInterval(timer);active=false;try{await api('trip/stop',{})}catch{}ui();$('#st').textContent=msg||'Trip ended.'}
function ui(){const b=$('#tbtn');b.textContent=active?'■ End Trip':'▶ Start Trip';b.className=active?'stop':'go';
  document.querySelectorAll('[name=m]').forEach(x=>x.disabled=active)}
function show(){$('#login').hidden=true;$('#trip').hidden=false;
  $('#title').textContent=label(route)+' · '+route.bus;
  $('#sub').textContent=route.driver+' · departs '+(route.time||'-')+' · '+route.stops.length+' stops'}

$('#go').onclick=async()=>{$('#err').textContent='';
  try{const id=$('#route').value,r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({route:id,pin:$('#pin').value})});
    const j=await r.json();if(!r.ok)throw new Error(j.error);
    token=j.token;sessionStorage.setItem('tok',token);route=routes.find(x=>x.id===id);show()}catch(e){$('#err').textContent=e.message}};
$('#tbtn').onclick=()=>(active?end():begin(true)).catch(e=>$('#st').textContent='⚠ '+e.message);
$('#out').onclick=async()=>{if(active)await end();sessionStorage.removeItem('tok');location.reload()};

(async()=>{try{routes=await(await fetch('/routes.json')).json()}catch{$('#err').textContent='Open this page through the server (node server.js).';return}
  $('#route').innerHTML=routes.map(r=>`<option value="${r.id}">${label(r)} · ${r.bus} · ${r.driver}</option>`).join('');
  if(token){try{const me=await api('me',{});route=routes.find(r=>r.id===me.route);show();if(me.active)begin(false)}
    catch{sessionStorage.removeItem('tok');token=null}}})();
</script></body></html>
