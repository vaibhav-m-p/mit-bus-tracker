<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MIT Mysore Bus Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;color:#1c1f26;background:#f4f5f7}
header{background:#1e3a8a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#facc15;color:#422006}
.badge.live{background:#22c55e;color:#052e16}
main{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 46px)}
aside{display:flex;flex-direction:column;background:#fff;border-right:1px solid #dde0e6;min-height:0}
#q{margin:12px;padding:11px 14px;font-size:15px;border:2px solid #c7cdd8;border-radius:10px;outline:none}
#q:focus{border-color:#1e3a8a}
#list{overflow:auto;flex:1;padding:0 12px 12px}
.card{padding:10px 12px;border:1px solid #e3e6ec;border-radius:10px;margin-bottom:8px;cursor:pointer}
.card:hover,.card.sel{border-color:#1e3a8a;background:#eef2ff}
.card b{font-size:15px}.muted{color:#667085;font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px}
.dot.off{background:#b4b9c4}
#detail{border-top:1px solid #dde0e6;padding:12px;max-height:42%;overflow:auto;background:#fafbfc}
#detail h2{margin:0 0 4px;font-size:16px}
#detail ol{margin:8px 0 0;padding-left:22px;columns:1}
#detail a{color:#1e3a8a;font-weight:600}
#map{height:100%;min-height:300px}
.bus{background:#facc15;border:2px solid #1c1f26;border-radius:8px;padding:1px 4px;font-weight:700;font-size:12px;white-space:nowrap;text-align:center}
.empty{padding:20px;text-align:center;color:#667085}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:46vh 1fr;height:auto}
#map{order:-1;height:46vh}aside{border-right:0}#list{max-height:40vh}}
</style>
</head>

/* ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=s=>String(s).replace(/\s+/g,'').toUpperCase();
const label=r=>r.group==='B'?'Route B'+r.no:'Route '+r.no+(r.id.endsWith('b')?'b':'');

const map=L.map('map').setView(CAMPUS,9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
L.marker(CAMPUS).addTo(map).bindPopup('<b>MIT Mysore</b><br>College campus');

const markers={},last={};let selected=null;
function popup(id){const p=last[id],r=ROUTES.find(x=>x.id===id);
  return `<b>${esc(label(r))}</b><br>${esc(r.bus)}<br>${esc(r.driver)}<br>${p.speed??'-'} km/h · ${Math.round((Date.now()-p.ts)/1000)}s ago`}
function update(list){
  const live=new Set(list.map(p=>p.route));
  Object.keys(markers).forEach(id=>{if(!live.has(id)){map.removeLayer(markers[id]);delete markers[id];delete last[id]}});
  list.forEach(p=>{const r=ROUTES.find(x=>x.id===p.route);if(!r)return;last[p.route]=p;
    if(!markers[p.route])markers[p.route]=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="bus">${esc(r.no)}</div>`,iconSize:[30,22],iconAnchor:[15,11]})})
      .addTo(map).bindPopup(()=>popup(p.route)).on('click',()=>select(r,false));
    else markers[p.route].setLatLng([p.lat,p.lng]);
    if(selected&&selected.id===p.route)map.panTo([p.lat,p.lng],{animate:true})});
  render();if(selected)showDetail(selected)}

function render(){
  const q=$('#q').value.trim().toLowerCase(),qn=q.replace(/\s+/g,'');
  let rs=ROUTES.map(r=>{
    const hay=[label(r),r.driver,r.phone,r.area,r.stops.join(' ')].join(' ').toLowerCase();
    let rank=9;
    if(!q)rank=5;
    else if(String(r.no)===q&&r.group==='A')rank=0;
    else if(label(r).toLowerCase().replace(/\s/g,'')===qn)rank=1;
    else if(key(r.bus).toLowerCase().includes(qn))rank=2;
    else if(hay.includes(q))rank=3;
    return{r,rank}}).filter(x=>x.rank<9).sort((a,b)=>a.rank-b.rank||a.r.no-b.r.no);
  $('#list').innerHTML=rs.length?rs.map(({r})=>{const on=last[r.id];
    return`<div class="card${selected&&selected.id===r.id?' sel':''}" data-id="${esc(r.id)}">
    <b>${esc(label(r))}</b> · ${esc(r.bus)} <span style="float:right" class="muted"><span class="dot${on?'':' off'}"></span>${on?'on trip':'not started'}</span>
    <div class="muted">${esc(r.driver)} · departs ${esc(r.time||'—')}</div>
    <div class="muted">${esc(r.stops[0]||'')}${r.stops.length?' → campus':''}</div></div>`}).join(''):'<div class="empty">No bus found. Try another number, driver or stop.</div>';
  $('#list').querySelectorAll('.card').forEach(c=>c.onclick=()=>select(ROUTES.find(r=>r.id===c.dataset.id),true))}

function showDetail(r){const p=last[r.id],d=$('#detail');d.hidden=false;
  const tel=r.phone.split('/')[0].replace(/\D/g,'');
  d.innerHTML=`<h2>${esc(label(r))} · ${esc(r.bus)}</h2>
  <div>${esc(r.area?r.area+' · ':'')}Driver: ${esc(r.driver)} ${tel?`· <a href="tel:${tel}">${esc(r.phone)}</a>`:''}</div>
  <div class="muted">Departs ${esc(r.time||'—')} · ${p?`<span class="dot"></span>${p.speed??'-'} km/h, updated ${Math.round((Date.now()-p.ts)/1000)}s ago`:'<span class="dot off"></span>trip not started yet'}</div>
  <ol>${r.stops.map(s=>`<li>${esc(s)}</li>`).join('')}<li><b>MIT Mysore campus</b></li></ol>`}

function select(r,fly){selected=r;render();showDetail(r);
  if(fly&&last[r.id]){map.flyTo([last[r.id].lat,last[r.id].lng],13);markers[r.id].openPopup()}}

$('#q').addEventListener('input',render);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=$('#list .card');if(c)c.click()}});

async function tick(){try{const l=await(await fetch(GPS_URL)).json();update(l);
  $('#mode').textContent=l.length+' live';$('#mode').classList.add('live')}
  catch(e){$('#mode').textContent='SERVER OFFLINE';$('#mode').classList.remove('live')}}
render();tick();setInterval(tick,POLL_MS);
</script>
